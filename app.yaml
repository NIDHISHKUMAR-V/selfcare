kind: wasmer.io/App.v0
owner: nidhishkumar-v
name: wellnest
package: .

jobs:
  - name: after_deploy
    trigger: post-deployment
    timeout: 10m
    retries: 0
    action:
      execute:
        command: php
        cli_args:
          - artisan
          - migrate
          - --force
          - --no-interaction
